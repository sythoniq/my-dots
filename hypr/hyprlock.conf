general {
	grace = 1
	fractional_scaling = 1.6 
	immediate_render = true
	hide_cursor = true
	ignore_empty_input = true
}

input-field {
    monitor =
    size = 150, 50
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    placeholder_text = "It be this..."

    outer_color = rgb(145, 234, 228) rgb(134, 168, 231) rgb(127, 127, 213) 90deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    check_text="Validating..."
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = -50, 50
    halign = center
    valign = center
}
